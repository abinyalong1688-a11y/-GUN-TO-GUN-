<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUN TO GUN · 四地图穿模验收 Demo</title>
<style>:root{color-scheme:dark;--bg:#080b11;--panel:rgba(12,16,23,.9);--line:rgba(255,255,255,.1);--txt:#edf2fa;--muted:#93a0b4;--amber:#f4b35f;--cyan:#62d9ff;--purple:#c986ff;--orange:#ff9a45;--ok:#67e2ad;--bad:#ff6868}
*{box-sizing:border-box}
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--txt)}
button{font:inherit}
#app{display:grid;grid-template-rows:58px 1fr}
#topbar{display:flex;align-items:center;gap:18px;padding:0 16px;background:#0b0f16;border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;letter-spacing:.06em}
.brand strong{font-size:14px}.brand small{color:var(--muted);font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px #f4b35f88}
#maps{display:flex;gap:6px;flex:1}
#maps button{border:1px solid var(--line);background:#131923;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:12px}
#maps button:hover{color:#fff;border-color:#ffffff33}
#maps button.active{color:#fff;border-color:#f4b35f99;background:#2a2117;box-shadow:inset 0 -2px #f4b35f}
.tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tools button{border:1px solid var(--line);background:#131923;color:#cfd7e4;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:11px}
.tools button:hover{border-color:#ffffff44}.tools button.on{color:#fff;border-color:#62d9ff88;background:#123047}
#viewport{position:relative;min-width:0;min-height:0}
#viewport canvas{display:block;width:100%;height:100%;outline:none}
#panel{position:absolute;top:18px;right:18px;width:286px;max-height:calc(100% - 36px);overflow:auto;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 18px 60px #0008;z-index:5}
.panel-head{display:flex;gap:12px;align-items:center}
#map-index{font-size:34px;font-weight:800;color:var(--amber);line-height:1}
#map-name{font-size:16px;margin:0 0 4px}#map-sub{font-size:11px;color:var(--muted);margin:0}
.audit{margin-top:16px;padding:10px 12px;border-radius:9px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.audit.ok{background:#123227;color:var(--ok);border:1px solid #67e2ad44}.audit.bad{background:#3a1719;color:var(--bad);border:1px solid #ff686844}
.audit b{font-weight:600}.audit span{font-size:22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 18px}
.stats div{background:#0d131d;border:1px solid var(--line);border-radius:8px;padding:9px 5px;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:9px;color:var(--muted)}
.section-title{font-size:10px;letter-spacing:.12em;color:#748197;text-transform:uppercase;margin:16px 0 7px}
.note{font-size:11px;line-height:1.65;color:#c4cedd;margin:0}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}.legend i:first-child{margin-left:0}
.cyan{background:var(--cyan)}.purple{background:var(--purple)}.orange{background:var(--orange)}
.help{font-size:10px;line-height:1.8;color:var(--muted);padding-left:16px;margin:0}.help b{color:#dce5f2;font-weight:500}
#conflicts{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted)}
#conflicts summary{cursor:pointer;color:#dce5f2}
.conflict-list{max-height:170px;overflow:auto;margin-top:8px;font-family:Consolas,monospace;font-size:9px;line-height:1.6;white-space:pre-wrap;color:#ffb3a0}
.panel-foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);font-size:9px;line-height:1.6;color:#68758a}
#loading{position:absolute;inset:58px 0 0;display:flex;align-items:center;justify-content:center;background:#080b11;color:var(--muted);font-size:13px;z-index:20;transition:opacity .25s}
#loading.done{opacity:0;pointer-events:none}
@media(max-width:1100px){.brand small{display:none}#panel{width:250px}.tools button{padding:6px}.tools button[data-act="full"]{display:none}}
@media(max-width:760px){#topbar{gap:8px;padding:0 8px}.brand strong{display:none}#maps{overflow:auto}#maps button{padding:7px 9px}.tools{display:none}#panel{top:auto;bottom:10px;right:10px;left:10px;width:auto;max-height:42%;padding:12px}.stats{margin-bottom:8px}.help,.legend,.panel-foot{display:none}.note{font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="dot"></span><strong>GUN TO GUN</strong><small>四地图穿模验收</small></div>
    <nav id="maps" aria-label="地图选择"></nav>
    <div class="tools">
      <button data-act="top" title="快捷键 T">俯视</button>
      <button data-act="persp" title="快捷键 P">透视</button>
      <button data-act="colliders" title="快捷键 C">Collider</button>
      <button data-act="markers" title="快捷键 M">修复点</button>
      <button data-act="fog" title="快捷键 F">雾效</button>
      <button data-act="tour" title="空格">自动巡览</button>
      <button data-act="full" title="全屏">全屏</button>
    </div>
  </header>
  <main id="viewport"></main>
  <aside id="panel">
    <div class="panel-head">
      <span id="map-index">01</span>
      <div><h1 id="map-name">Desert Outpost</h1><p id="map-sub">沙漠哨站 · Sunset</p></div>
    </div>
    <div id="audit" class="audit ok"><b>AABB 冲突</b><span>0</span></div>
    <div class="stats">
      <div><b id="stat-colliders">0</b><span>colliders</span></div>
      <div><b id="stat-los">0</b><span>LOS statics</span></div>
      <div><b id="stat-fixes">0</b><span>本轮修复点</span></div>
    </div>
    <div class="section-title">验收说明</div>
    <p id="map-note" class="note"></p>
    <div class="section-title">图例</div>
    <div class="legend"><i class="cyan"></i>地面 collider <i class="purple"></i>overhead collider <i class="orange"></i>修复点</div>
    <div class="section-title">操作</div>
    <ul class="help">
      <li><b>左键拖动</b> 旋转 · <b>滚轮</b> 缩放</li>
      <li><b>右键拖动</b> 平移 · <b>1–4</b> 切图</li>
      <li><b>T</b> 俯视 · <b>P</b> 透视 · <b>C</b> 碰撞线框</li>
      <li><b>M</b> 修复点 · <b>F</b> 雾效 · <b>空格</b> 自动巡览</li>
    </ul>
    <details id="conflicts"><summary>冲突明细</summary><div id="conflict-list" class="conflict-list">无冲突</div></details>
    <div class="panel-foot">检查模式：雾效默认关闭，亮度按地图微调；仅影响本 demo。</div>
  </aside>
  <div id="loading">正在生成程序化贴图与地图…</div>
</div>
