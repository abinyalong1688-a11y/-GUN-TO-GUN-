name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check single-file size budget (<5MB)
        run: |
          node -e "const fs=require('fs');const b=fs.statSync('dist/gun-to-gun.html').size;if(b>5*1024*1024){console.error('build too large: '+b);process.exit(1)}console.log('dist size '+b+' bytes')"
